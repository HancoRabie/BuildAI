plugins { id 'fabric-loom' version '1.7-SNAPSHOT'; id 'maven-publish' }
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
loom { splitEnvironmentSourceSets(); mods { "buildai" { sourceSet sourceSets.main; sourceSet sourceSets.client } } }
dependencies {
    minecraft "com.mojang:minecraft:" + project.minecraft_version
    mappings "net.fabricmc:yarn:" + project.yarn_mappings + ":v2"
    modImplementation "net.fabricmc:fabric-loader:" + project.loader_version
    modImplementation "net.fabricmc.fabric-api:fabric-api:" + project.fabric_version
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}
processResources { inputs.property 'version',project.version; filesMatching('fabric.mod.json') { expand 'version':project.version } }
tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }

// Loom's split source sets don't automatically expose mapped Minecraft dependencies to JUnit.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events "failed"
        exceptionFormat "full"
        showCauses true
        showStackTraces true
    }
}
